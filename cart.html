<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Shopping Cart & Checkout — Gull e Gulzar Home Trolley</title>
  <link rel="stylesheet" href="assets/theme.css">
</head>
<body>
  <!-- Announcement Bar -->
  <div class="announcement-bar">
    <div class="container">
      <div class="announcement-content">
        <span>✨</span>
        <span>✦ Safe Delivery across Pakistan | Multi-Layer Crate Protection ✦</span>
      </div>
      <div class="announcement-actions">
        <span>Direct WhatsApp:</span>
        <a href="https://wa.me/923204967079" target="_blank" class="announcement-phone">+923204967079</a>
        <span>|</span>
        <a href="https://wa.me/923004055876" target="_blank" class="announcement-phone">+923004055876</a>
      </div>
    </div>
  </div>

  <header class="site-header">
    <div class="container">
      <div class="header-inner">
        <a href="index.html" class="header-brand">
          <span class="brand-title">Gull e Gulzar</span>
          <span class="brand-tagline">Home Trolley & Luxury Tables</span>
        </a>
        <nav class="header-nav">
          <a href="index.html" class="nav-link">Home</a>
          <a href="collections.html" class="nav-link">Catalog</a>
          <a href="contact.html" class="nav-link">Contact Us</a>
        </nav>
        <div class="header-actions">
          <a href="https://wa.me/923204967079" target="_blank" class="header-whatsapp-cta">
            <svg class="icon icon-whatsapp" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
            <span>WhatsApp Support</span>
          </a>
        </div>
      </div>
    </div>
  </header>

  <div class="section-spacing" style="background: var(--color-bg-body); min-height: 70vh;">
    <div class="container" style="max-width: 900px;">
      <div class="section-header" style="text-align: left; margin-bottom: 2rem;">
        <span class="subheading">Your Order</span>
        <h1 style="font-size: 2.6rem;">Shopping Cart & Checkout</h1>
      </div>

      <div id="cart-page-content" style="background: #FFFFFF; border-radius: var(--radius-lg); border: 1px solid var(--color-border); padding: 2.5rem; box-shadow: var(--shadow-sm);">
        <!-- Populated via script -->
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom" style="border: none; padding-top: 0;">
        <div>&copy; 2026 <strong>Gull e Gulzar Home Trolley</strong>. All rights reserved.</div>
      </div>
    </div>
  </footer>

  <script src="assets/theme.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('cart-page-content');
      const cart = JSON.parse(localStorage.getItem('gg_cart') || '[]');
      if (!container) return;

      if (cart.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; padding: 3rem 1rem;">
            <h3 style="font-size: 1.5rem; margin-bottom: 0.5rem;">Your Cart is Currently Empty</h3>
            <p style="color: var(--color-muted); margin-bottom: 2rem;">Browse our handcrafted tea trolleys, nesting sets, and center tables.</p>
            <a href="collections.html" class="btn btn-primary">Browse Collections</a>
          </div>
        `;
        return;
      }

      let subtotal = 0;
      let itemsHtml = cart.map((item, idx) => {
        const priceNum = parseInt(item.price.replace(/[^0-9]/g, '')) || 0;
        subtotal += priceNum * item.quantity;
        return `
          <div style="display: flex; gap: 1.5rem; align-items: center; padding: 1.25rem 0; border-bottom: 1px solid var(--color-border);">
            <img src="${item.image}" alt="${item.title}" style="width: 85px; height: 85px; object-fit: cover; border-radius: var(--radius-sm); border: 1px solid var(--color-border);">
            <div style="flex: 1;">
              <h4 style="font-size: 1.15rem; margin-bottom: 0.25rem;">${item.title}</h4>
              <div style="font-size: 0.85rem; color: var(--color-muted);">Finish: ${item.variant}</div>
              <div style="font-weight: 700; color: var(--color-gold); margin-top: 0.35rem;">${item.price}</div>
            </div>
            <div style="text-align: right;">
              <span style="font-weight: 600;">Qty: ${item.quantity}</span>
            </div>
          </div>
        `;
      }).join('');

      container.innerHTML = `
        ${itemsHtml}
        <div style="display: flex; justify-content: space-between; align-items: baseline; margin-top: 2rem; padding-top: 1.5rem; border-top: 2px solid var(--color-border);">
          <span style="font-size: 1.3rem; font-weight: 600;">Subtotal:</span>
          <span style="font-size: 1.8rem; font-weight: 700; color: var(--color-heading);">Rs. ${subtotal.toLocaleString()}</span>
        </div>
        <p style="color: var(--color-muted); font-size: 0.85rem; margin-top: 0.5rem; margin-bottom: 2rem;">
          🚚 Safe nationwide delivery included in high-density foam & custom wooden crates.
        </p>
        <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
          <button type="button" class="btn btn-primary" style="flex: 1; padding: 1rem;" onclick="alert('Order successfully processed! Thank you for shopping with Gull e Gulzar.'); localStorage.removeItem('gg_cart'); location.reload();">
            Complete Order & Payment
          </button>
          <a href="collections.html" class="btn btn-outline" style="flex: 1; padding: 1rem; text-align: center;">
            Continue Shopping
          </a>
        </div>
      `;
    });
  </script>
</body>
</html>
