<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0c362d">
  <title>Your Cart | Gull e Gulzar Home Trolley</title>
  <link rel="stylesheet" href="assets/theme.css?v=14">
</head>
<body class="cart-page">
  <div data-store-header></div>
  <main>
    <section class="section-spacing cart-page-section">
      <div class="container cart-page-container">
        <div class="section-header cart-page-heading">
          <span class="subheading">Your selection</span>
          <h1>Your Cart</h1>
          <p>Review your Mini Coffee Table order and contact us when you're ready.</p>
        </div>
        <div class="cart-page-content" id="cart-page-content" aria-live="polite"></div>
      </div>
    </section>
  </main>
  <div data-store-footer></div>
  <script src="assets/page-shell.js?v=5"></script>
  <script src="assets/theme.js?v=14"></script>
  <script>
    const persistCart = (cart) => {
      localStorage.setItem('gg_cart', JSON.stringify(cart));
      window.dispatchEvent(new Event('gg-cart-updated'));
    };

    const renderCartPage = () => {
      const container = document.querySelector('#cart-page-content');
      const cart = JSON.parse(localStorage.getItem('gg_cart') || '[]');
      if (!container) return;

      container.replaceChildren();
      if (cart.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'cart-page-empty';
        const heading = document.createElement('h2');
        heading.textContent = 'Your cart is empty';
        const message = document.createElement('p');
        message.textContent = 'Discover our Mini Coffee Table, thoughtfully styled for everyday living.';
        const link = document.createElement('a');
        link.className = 'btn btn-primary';
        link.href = 'product-mini-coffee.html';
        link.textContent = 'View Mini Coffee Table';
        empty.append(heading, message, link);
        container.append(empty);
        return;
      }

      let subtotal = 0;
      const items = document.createElement('div');
      items.className = 'cart-page-items';
      cart.forEach((item, index) => {
        const price = Number.parseInt(String(item.price).replace(/[^0-9]/g, ''), 10) || 0;
        const quantity = Math.max(1, Number.parseInt(item.quantity, 10) || 1);
        subtotal += price * quantity;

        const row = document.createElement('article');
        row.className = 'cart-page-item';
        const image = document.createElement('img');
        image.src = item.image || 'assets/mini-coffee.jpg';
        image.alt = item.title || 'Mini Coffee Table';
        image.loading = 'lazy';
        const details = document.createElement('div');
        details.className = 'cart-page-item-details';
        const title = document.createElement('h2');
        title.textContent = item.title || 'Mini Coffee Table';
        const variant = document.createElement('p');
        variant.textContent = item.variant && item.variant !== 'Standard' ? item.variant : 'Standard design';
        const priceLine = document.createElement('strong');
        priceLine.textContent = `Rs. ${price.toLocaleString('en-PK')} each`;
        const quantityControl = document.createElement('div');
        quantityControl.className = 'cart-page-quantity';
        const decreaseButton = document.createElement('button');
        decreaseButton.type = 'button';
        decreaseButton.className = 'cart-quantity-step';
        decreaseButton.textContent = '−';
        decreaseButton.setAttribute('aria-label', `Decrease quantity of ${title.textContent}`);
        const quantityInput = document.createElement('input');
        quantityInput.type = 'number';
        quantityInput.min = '1';
        quantityInput.step = '1';
        quantityInput.inputMode = 'numeric';
        quantityInput.value = String(quantity);
        quantityInput.setAttribute('aria-label', `Quantity of ${title.textContent}`);
        const increaseButton = document.createElement('button');
        increaseButton.type = 'button';
        increaseButton.className = 'cart-quantity-step';
        increaseButton.textContent = '+';
        increaseButton.setAttribute('aria-label', `Increase quantity of ${title.textContent}`);
        const saveQuantity = (nextQuantity) => {
          item.quantity = Math.max(1, Number.parseInt(nextQuantity, 10) || 1);
          persistCart(cart);
          renderCartPage();
        };
        decreaseButton.addEventListener('click', () => saveQuantity(quantity - 1));
        increaseButton.addEventListener('click', () => saveQuantity(quantity + 1));
        quantityInput.addEventListener('change', () => saveQuantity(quantityInput.value));
        quantityControl.append(decreaseButton, quantityInput, increaseButton);
        details.append(title, variant, priceLine, quantityControl);
        const removeButton = document.createElement('button');
        removeButton.className = 'cart-page-remove';
        removeButton.type = 'button';
        removeButton.textContent = 'Remove';
        removeButton.setAttribute('aria-label', `Remove ${title.textContent} from cart`);
        removeButton.addEventListener('click', () => {
          cart.splice(index, 1);
          persistCart(cart);
          renderCartPage();
        });
        row.append(image, details, removeButton);
        items.append(row);
      });

      const summary = document.createElement('div');
      summary.className = 'cart-page-summary';
      const subtotalLabel = document.createElement('span');
      subtotalLabel.textContent = 'Subtotal';
      const subtotalPrice = document.createElement('strong');
      subtotalPrice.textContent = `Rs. ${subtotal.toLocaleString('en-PK')}`;
      summary.append(subtotalLabel, subtotalPrice);

      const note = document.createElement('p');
      note.className = 'cart-page-note';
      note.textContent = 'Delivery is free across Pakistan. Our team can confirm the delivery estimate when you place your order.';

            const actions = document.createElement('div');
      actions.className = 'cart-page-actions';
      const checkoutBtn = document.createElement('a');
      checkoutBtn.className = 'btn btn-primary';
      checkoutBtn.href = '#';
      checkoutBtn.textContent = 'Proceed to Checkout';
      checkoutBtn.onclick = (e) => {
        e.preventDefault();
        alert('Thank you for shopping with Gull e Gulzar Home Trolley.');
      };
      const continueLink = document.createElement('a');
      continueLink.className = 'btn btn-outline';
      continueLink.href = 'collections.html';
      continueLink.textContent = 'Continue Shopping';
      actions.append(checkoutBtn, continueLink);
      container.append(items, summary, note, actions);
    };

    renderCartPage();
  </script>
</body>
</html>
