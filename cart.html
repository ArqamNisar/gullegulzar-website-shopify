<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0c362d">
  <title>Your Cart | Gull e Gulzar Home Trolley</title>
  <link rel="stylesheet" href="assets/theme.css?v=9">
</head>
<body class="cart-page">
  <div data-store-header></div>
  <main>
    <section class="section-spacing cart-page-section">
      <div class="container cart-page-container">
        <div class="section-header cart-page-heading">
          <span class="subheading">Your selection</span>
          <h1>Your Cart</h1>
          <p>Review your Mini Coffee Table order and contact us when you're ready.</p>
        </div>
        <div class="cart-page-content" id="cart-page-content" aria-live="polite"></div>
      </div>
    </section>
  </main>
  <div data-store-footer></div>
  <script src="assets/page-shell.js?v=4"></script>
  <script src="assets/theme.js?v=9"></script>
  <script>
    const renderCartPage = () => {
      const container = document.querySelector('#cart-page-content');
      const cart = JSON.parse(localStorage.getItem('gg_cart') || '[]');
      if (!container) return;

      container.replaceChildren();
      if (cart.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'cart-page-empty';
        const heading = document.createElement('h2');
        heading.textContent = 'Your cart is empty';
        const message = document.createElement('p');
        message.textContent = 'Take a look at our Mini Coffee Table.';
        const link = document.createElement('a');
        link.className = 'btn btn-primary';
        link.href = 'product-mini-coffee.html';
        link.textContent = 'View Mini Coffee Table';
        empty.append(heading, message, link);
        container.append(empty);
        return;
      }

      let subtotal = 0;
      const items = document.createElement('div');
      items.className = 'cart-page-items';
      cart.forEach((item) => {
        const price = Number.parseInt(String(item.price).replace(/[^0-9]/g, ''), 10) || 0;
        const quantity = Math.max(1, Number.parseInt(item.quantity, 10) || 1);
        subtotal += price * quantity;

        const row = document.createElement('article');
        row.className = 'cart-page-item';
        const image = document.createElement('img');
        image.src = item.image || 'assets/mini-coffee.jpg';
        image.alt = item.title || 'Mini Coffee Table';
        image.loading = 'lazy';
        const details = document.createElement('div');
        details.className = 'cart-page-item-details';
        const title = document.createElement('h2');
        title.textContent = item.title || 'Mini Coffee Table';
        const variant = document.createElement('p');
        variant.textContent = item.variant && item.variant !== 'Standard' ? item.variant : 'Standard design';
        const priceLine = document.createElement('strong');
        priceLine.textContent = `Rs. ${price.toLocaleString('en-PK')} × ${quantity}`;
        details.append(title, variant, priceLine);
        row.append(image, details);
        items.append(row);
      });

      const summary = document.createElement('div');
      summary.className = 'cart-page-summary';
      const subtotalLabel = document.createElement('span');
      subtotalLabel.textContent = 'Subtotal';
      const subtotalPrice = document.createElement('strong');
      subtotalPrice.textContent = `Rs. ${subtotal.toLocaleString('en-PK')}`;
      summary.append(subtotalLabel, subtotalPrice);

      const note = document.createElement('p');
      note.className = 'cart-page-note';
      note.textContent = 'Delivery is free across Pakistan. Our team can confirm the delivery estimate when you place your order.';

      const actions = document.createElement('div');
      actions.className = 'cart-page-actions';
      const orderLink = document.createElement('a');
      orderLink.className = 'btn btn-primary';
      orderLink.target = '_blank';
      orderLink.rel = 'noopener noreferrer';
      orderLink.textContent = 'Continue on WhatsApp';
      const orderText = cart.map((item) => `${Math.max(1, Number.parseInt(item.quantity, 10) || 1)} x ${item.title || 'Mini Coffee Table'} (${item.price || 'Rs. 5,500'})`).join('\n');
      orderLink.href = `https://wa.me/923204967079?text=${encodeURIComponent(`Hello Gull e Gulzar Home Trolley, I would like to place this order:\n${orderText}\nSubtotal: Rs. ${subtotal.toLocaleString('en-PK')}`)}`;
      const continueLink = document.createElement('a');
      continueLink.className = 'btn btn-outline';
      continueLink.href = 'collections.html';
      continueLink.textContent = 'Continue Shopping';
      actions.append(orderLink, continueLink);
      container.append(items, summary, note, actions);
    };

    renderCartPage();
  </script>
</body>
</html>
